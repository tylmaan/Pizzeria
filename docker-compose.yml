# Local development infrastructure.
#   docker compose up -d                      -> PostgreSQL + PostGIS
#   docker compose --profile tools up -d      -> + pgAdmin (http://localhost:5050)
# Values come from .env (copy .env.example); defaults below are for local dev only.
name: pizzeria

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pizzeria}
      POSTGRES_USER: ${POSTGRES_USER:-pizzeria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizzeria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pizzeria.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
